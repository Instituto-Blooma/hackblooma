name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      E2E_AUTH_SECRET: local-e2e-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Cache Convex local binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-${{ runner.os }}-v1

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Bootstrap local Convex + auth env
        run: pnpm run setup

      - name: Enlarge /dev/shm for Chromium
        run: sudo mount -o remount,size=2G /dev/shm || true

      - name: Start E2E stack (blocking readiness)
        run: pnpm run e2e:stack:up

      - name: Run Cypress
        run: pnpm exec cypress run --browser chrome

      - name: Stop E2E stack
        if: always()
        run: pnpm run e2e:stack:down

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
